server {
    listen 80;
    server_name test.com www.test.com;  

      location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts if needed
        proxy_connect_timeout 600s;        # Increased from 300s
        proxy_send_timeout 600s;           # Increased from 300s
        proxy_read_timeout 600s;           # Increased from 300s
        send_timeout 600s;                 # Added
        keepalive_timeout 650s;            # Added
        
        # Added client body settings
        client_max_body_size 50M;          # Added
        client_body_timeout 600s;          # Added
        
        
        # Add error handling
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        
        # Add keepalive settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    # Add error pages (optional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}